# ===============================
# 1. TEST DATABASE (H2)
# ===============================
# We use in-memory H2 so we don't touch your real NeonDB
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ===============================
# 2. DUMMY JWT CONFIG
# ===============================
# Tests need these keys to exist, but the values don't need to be real secrets
jwt.secret=TestSecretKeyThatIsLongEnoughForSigning1234567890
jwt.expiration=3600000

# ===============================
# 3. DUMMY FRONTEND CONFIG
# ===============================
# Your WebConfig likely needs this key too
frontend.url=http://localhost:3000